
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYNEX - Bilyard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:radial-gradient(circle at top,#193d3a,#071411 75%);
 color:white;font-family:Arial,sans-serif;
 text-align:center;padding:16px 10px 30px
}
header{
 max-width:600px;margin:auto;padding:15px;
 background:#142b29;border:1px solid #34766a;border-radius:15px
}
.logo{font-size:25px;font-weight:900;letter-spacing:2px;color:#6de7ff}
header p{color:#b9d9d0;font-size:13px;margin-top:6px}
h1{color:#ffe28a;margin:22px 0 8px}
.subtitle{color:#b9d9d0;font-size:14px;margin-bottom:18px}
.scoreboard{
 max-width:600px;margin:0 auto 15px;
 display:flex;gap:10px
}
.scorebox{
 flex:1;background:#142b29;border:1px solid #34766a;
 padding:12px;border-radius:12px
}
.scorebox span{display:block;color:#9dc8bb;font-size:12px;margin-bottom:5px}
.scorebox strong{font-size:22px;color:#ffe28a}
.table-wrap{
 width:min(96vw,900px);margin:0 auto;padding:12px;
 border-radius:22px;
 background:linear-gradient(135deg,#8b5527,#d49a4c,#75421d);
 box-shadow:0 12px 30px #0008
}
canvas{
 display:block;width:100%;height:auto;border-radius:12px;
 touch-action:none;background:#087b4b
}
.controls{
 max-width:600px;margin:18px auto;padding:16px;
 background:#142b29;border:1px solid #34766a;border-radius:15px
}
.controls label{display:block;margin-bottom:10px;color:#c5e2d8}
input[type=range]{width:100%;accent-color:#ffd15c}
.power-label{color:#ffe28a;font-weight:bold;margin-top:8px}
.buttons{display:flex;gap:10px;margin-top:15px}
button{
 flex:1;border:0;border-radius:11px;padding:13px 8px;
 font-size:15px;font-weight:bold;cursor:pointer
}
#shootBtn{background:linear-gradient(90deg,#ffe47b,#ffb52e);color:#241b08}
#resetBtn{background:#286b61;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.message{
 max-width:600px;margin:12px auto;color:#d4e9df;
 min-height:25px;font-size:14px;line-height:1.5
}
.back{display:inline-block;margin-top:15px;color:#6de7ff;text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<header>
 <div class="logo">PLAYNEX</div>
 <p>O‘yinlar olamiga xush kelibsiz! 🎮</p>
</header>

<h1>🎱 BILYARD</h1>
<p class="subtitle">Nishonga ol, zarba ber va sharlarni luqmaga tushir!</p>

<div class="scoreboard">
 <div class="scorebox">
  <span>🏆 OCHKO</span>
  <strong id="score">0</strong>
 </div>
 <div class="scorebox">
  <span>🎯 TUSHGAN SHARLAR</span>
  <strong id="potted">0 / 7</strong>
 </div>
</div>

<div class="table-wrap">
 <canvas id="table" width="900" height="500"></canvas>
</div>

<div class="controls">
 <label for="power">💥 Zarba kuchi</label>
 <input id="power" type="range" min="5" max="25" value="14">
 <div class="power-label">Kuch: <span id="powerValue">14</span></div>
 <div class="buttons">
  <button id="shootBtn" onclick="shoot()">🎱 ZARBA BERISH</button>
  <button id="resetBtn" onclick="newGame()">🔄 QAYTA BOSHLASH</button>
 </div>
</div>

<div class="message" id="message">
 Oq sharni nishonga ol va zarba ber!
</div>

<a class="back" href="index.html">⬅ PLAYNEX bosh menyusiga</a>

<script>
const canvas=document.getElementById("table");
const ctx=canvas.getContext("2d");

const W=900,H=500;
const tableLeft=55;
const tableRight=845;
const tableTop=55;
const tableBottom=445;
const ballR=13;
const pocketR=29;

const pockets=[
 {x:tableLeft,y:tableTop},
 {x:450,y:tableTop},
 {x:tableRight,y:tableTop},
 {x:tableLeft,y:tableBottom},
 {x:450,y:tableBottom},
 {x:tableRight,y:tableBottom}
];

const colors=[
 "#f5d22d","#2367e8","#e53935","#8d42b5",
 "#ef8b23","#159b69","#a52c35"
];

let balls=[];
let score=0;
let potted=0;
let aimAngle=0;
let moving=false;
let gameOver=false;
let animationId=null;

function createBall(x,y,color,number,isCue=false){
 return {
  x,y,vx:0,vy:0,color,number,isCue,active:true
 };
}

function showMessage(text){
 document.getElementById("message").textContent=text;
}

function updateScore(){
 document.getElementById("score").textContent=score;
 document.getElementById("potted").textContent=potted+" / 7";
}

function newGame(){
 if(animationId!==null){
  cancelAnimationFrame(animationId);
  animationId=null;
 }

 balls=[];
 score=0;
 potted=0;
 moving=false;
 gameOver=false;
 aimAngle=0;

 balls.push(createBall(250,250,"#ffffff",0,true));

 const positions=[
  [620,250],
  [647,235],[647,265],
  [674,220],[674,250],[674,280],
  [701,205],[701,235],[701,265],[701,295]
 ];

 for(let i=0;i<7;i++){
  balls.push(createBall(
   positions[i][0],
   positions[i][1],
   colors[i],
   i+1
  ));
 }

 updateScore();
 document.getElementById("shootBtn").disabled=false;
 showMessage("O‘yin boshlandi! Oq sharni nishonga olib zarba ber.");
 draw();
}

document.getElementById("power").addEventListener("input",e=>{
 document.getElementById("powerValue").textContent=e.target.value;
});

function getPointerPosition(e){
 const rect=canvas.getBoundingClientRect();
 return {
  x:(e.clientX-rect.left)*W/rect.width,
  y:(e.clientY-rect.top)*H/rect.height
 };
}

canvas.addEventListener("pointermove",e=>{
 const cue=balls.find(b=>b.isCue&&b.active);
 if(!cue||moving||gameOver)return;

 const pos=getPointerPosition(e);
 aimAngle=Math.atan2(pos.y-cue.y,pos.x-cue.x);
 draw();
});

canvas.addEventListener("pointerdown",e=>{
 const cue=balls.find(b=>b.isCue&&b.active);
 if(!cue||moving||gameOver)return;

 const pos=getPointerPosition(e);
 aimAngle=Math.atan2(pos.y-cue.y,pos.x-cue.x);
 draw();
});

function shoot(){
 const cue=balls.find(b=>b.isCue&&b.active);

 if(!cue||moving||gameOver)return;

 const power=Number(document.getElementById("power").value);

 cue.vx=Math.cos(aimAngle)*power;
 cue.vy=Math.sin(aimAngle)*power;

 moving=true;
 document.getElementById("shootBtn").disabled=true;
 showMessage("Zarba berildi! 🎱");

 animationId=requestAnimationFrame(physics);
}

function drawTable(){
 ctx.clearRect(0,0,W,H);

 const gradient=ctx.createLinearGradient(0,0,0,H);
 gradient.addColorStop(0,"#098b55");
 gradient.addColorStop(1,"#05633c");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="#38bb82";
 ctx.lineWidth=7;
 ctx.strokeRect(tableLeft,tableTop,
  tableRight-tableLeft,tableBottom-tableTop);

 pockets.forEach(p=>{
  ctx.beginPath();
  ctx.arc(p.x,p.y,pocketR,0,Math.PI*2);
  ctx.fillStyle="#050806";
  ctx.fill();
  ctx.strokeStyle="#b47a3a";
  ctx.lineWidth=4;
  ctx.stroke();
 });

 ctx.strokeStyle="#ffffff44";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(250,tableTop);
 ctx.lineTo(250,tableBottom);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(250,250,70,0,Math.PI*2);
 ctx.stroke();
}

function drawBalls(){
 balls.forEach(b=>{
  if(!b.active)return;

  ctx.beginPath();
  ctx.arc(b.x,b.y,ballR,0,Math.PI*2);
  ctx.fillStyle=b.color;
  ctx.fill();

  ctx.strokeStyle="#ffffffaa";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(b.x-4,b.y-5,4,0,Math.PI*2);
  ctx.fillStyle="#ffffff99";
  ctx.fill();

  if(!b.isCue){
   ctx.beginPath();
   ctx.arc(b.x,b.y,6,0,Math.PI*2);
   ctx.fillStyle="white";
   ctx.fill();

   ctx.fillStyle="#111";
   ctx.font="bold 9px Arial";
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   ctx.fillText(b.number,b.x,b.y);
  }
 });
}

function drawAim(){
 const cue=balls.find(b=>b.isCue&&b.active);
 if(!cue||moving||gameOver)return;

 const endX=cue.x+Math.cos(aimAngle)*180;
 const endY=cue.y+Math.sin(aimAngle)*180;

 ctx.save();
 ctx.setLineDash([8,7]);
 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(cue.x,cue.y);
 ctx.lineTo(endX,endY);
 ctx.stroke();
 ctx.restore();

 ctx.strokeStyle="#e3bd83";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(
  cue.x-Math.cos(aimAngle)*95,
  cue.y-Math.sin(aimAngle)*95
 );
 ctx.lineTo(
  cue.x-Math.cos(aimAngle)*22,
  cue.y-Math.sin(aimAngle)*22
 );
 ctx.stroke();
}

function draw(){
 drawTable();
 drawBalls();
 drawAim();
}

function pocketCheck(b){
 for(const p of pockets){
  const dx=b.x-p.x;
  const dy=b.y-p.y;

  if(Math.hypot(dx,dy)<pocketR){
   b.active=false;
   b.vx=0;
   b.vy=0;

   if(b.isCue){
    showMessage("Oq shar luqmaga tushdi! Qayta joylashtirilmoqda.");
    setTimeout(placeCueBall,500);
   }else{
    score+=100;
    potted++;
    updateScore();

    if(potted>=7){
     gameOver=true;
     showMessage("🏆 G‘ALABA! Barcha sharlarni tushirding! Ochko: "+score);
    }else{
     showMessage("Ajoyib! Shar luqmaga tushdi! +100 ochko.");
    }
   }
   return true;
  }
 }
 return false;
}

function placeCueBall(){
 if(gameOver)return;

 const cue=balls.find(b=>b.isCue);
 if(!cue)return;

 cue.x=250;
 cue.y=250;
 cue.vx=0;
 cue.vy=0;
 cue.active=true;
 draw();
}

function collideBalls(){
 for(let i=0;i<balls.length;i++){
  for(let j=i+1;j<balls.length;j++){
   const a=balls[i];
   const b=balls[j];

   if(!a.active||!b.active)continue;

   const dx=b.x-a.x;
   const dy=b.y-a.y;
   const dist=Math.hypot(dx,dy);
   const min=ballR*2;

   if(dist<min&&dist>0){
    const nx=dx/dist;
    const ny=dy/dist;
    const overlap=min-dist;

    a.x-=nx*overlap/2;
    a.y-=ny*overlap/2;
    b.x+=nx*overlap/2;
    b.y+=ny*overlap/2;

    const relative=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;

    if(relative>0){
     const impulse=relative*0.96;
     a.vx-=impulse*nx;
     a.vy-=impulse*ny;
     b.vx+=impulse*nx;
     b.vy+=impulse*ny;
    }
   }
  }
 }
}

function physics(){
 let anyMoving=false;

 balls.forEach(b=>{
  if(!b.active)return;

  b.x+=b.vx;
  b.y+=b.vy;

  b.vx*=0.985;
  b.vy*=0.985;

  if(Math.abs(b.vx)<0.035)b.vx=0;
  if(Math.abs(b.vy)<0.035)b.vy=0;

  if(b.x<tableLeft+ballR){
   b.x=tableLeft+ballR;
   b.vx=Math.abs(b.vx)*0.88;
  }

  if(b.x>tableRight-ballR){
   b.x=tableRight-ballR;
   b.vx=-Math.abs(b.vx)*0.88;
  }

  if(b.y<tableTop+ballR){
   b.y=tableTop+ballR;
   b.vy=Math.abs(b.vy)*0.88;
  }

  if(b.y>tableBottom-ballR){
   b.y=tableBottom-ballR;
   b.vy=-Math.abs(b.vy)*0.88;
  }

  if(b.vx!==0||b.vy!==0)anyMoving=true;
 });

 collideBalls();

 balls.forEach(b=>{
  if(b.active)pocketCheck(b);
 });

 draw();

 if(anyMoving){
  animationId=requestAnimationFrame(physics);
 }else{
  moving=false;
  animationId=null;

  if(!gameOver){
   document.getElementById("shootBtn").disabled=false;
   showMessage("Sharlar to‘xtadi. Yana nishonga olib zarba ber!");
  }
 }
}

newGame();
</script>

</body>
</html>
